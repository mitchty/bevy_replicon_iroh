[workspace]
members = [
  "crates/bevy_replicon_iroh",
  "crates/examples_common",
  "crates/examples",
]
resolver = "3"

[workspace.package]
version = "0.20.0"
license = "BlueOak-1.0.0"

[workspace.metadata.crane]
name = "bevy_replicon_iroh"

[workspace.dependencies]
bevy = { version = "~0.20", default-features = false }
bevy_replicon = { version = "~0.45", default-features = false }
bevy_replicon_iroh = { path = "crates/bevy_replicon_iroh" }
examples_common = { path = "crates/examples_common" }
iroh = "~1.3"
iroh-relay = { version = "~1.3", default-features = false }
tokio = { version = "~1", default-features = false }
bytes = "~1"
crossbeam-channel = "~0.5"
serde = { version = "~1", default-features = false }
tracing = "~0.1"
tracing-subscriber = { version = "~0.3", default-features = false }
anyhow = "~1"
clap = { version = "~4", default-features = false }
